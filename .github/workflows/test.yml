name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # only what the README tells users to install: no system ffmpeg, no extra fonts
      - run: pip install -r requirements.txt
      - name: beat detection
        run: python tests/test_beats.py
      - name: reference analysis
        run: python tests/test_ref.py
      - name: kinetic example (timeline + contact sheet)
        working-directory: examples/kinetic
        run: |
          python edit.py timeline
          python edit.py sheet
          python ../../scripts/engine.py fonts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sheet-${{ matrix.os }}-py${{ matrix.python }}
          path: examples/kinetic/sheet.png
          if-no-files-found: ignore
